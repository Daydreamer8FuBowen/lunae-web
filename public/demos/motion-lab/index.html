<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Lab · 5 demos</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.3 Arial,"Microsoft YaHei",sans-serif;background:#f5f3ee;color:#17211b}.shell{height:100%;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:24px;padding:14px 24px;background:#fffdf9;border-bottom:1px solid #d9ddd5;z-index:2}.brand{font-weight:800;white-space:nowrap}.brand i{color:#d76b4d;font-style:normal}.tabs{display:flex;gap:6px;overflow:auto}.tab{border:0;background:none;color:#68746b;padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}.tab.active{background:#17211b;color:#fff}.stage{position:relative;flex:1;min-height:0;background:#10131b}.frame{display:none;width:100%;height:100%;border:0}.frame.active{display:block}@media(max-width:700px){.top{display:block;padding:12px 14px}.brand{margin-bottom:8px}}</style></head><body><div class="shell"><header class="top"><div class="brand">Motion <i>Lab</i> / 5 demos</div><nav class="tabs"><button class="tab active">01 · Scroll Trigger</button><button class="tab">02 · Scroll Progress</button><button class="tab">03 · Sticky Scroll</button><button class="tab">04 · Text Reveal</button><button class="tab">05 · Parallax</button></nav></header><main class="stage"><iframe class="frame active" title="Demo 1"></iframe><iframe class="frame" title="Demo 2"></iframe><iframe class="frame" title="Demo 3"></iframe><iframe class="frame" title="Demo 4"></iframe><iframe class="frame" title="Demo 5"></iframe></main></div>
<script>
  // Self-contained documents: each demo keeps its own viewport and scroll animations.
  const pages = [
  "\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Demo 1\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#17211b;font:16px/1.3 Arial,\"Microsoft YaHei\",sans-serif}.hero{min-height:100vh;display:grid;place-items:center;padding:10vh 8vw}.hero h1{font-size:clamp(48px,8vw,96px);line-height:1.3}.hero p{max-width:620px;font-size:18px;color:#68746b}.section{padding:100px 8vw}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:28px;border-radius:22px;background:#fffdf9;min-height:200px}.reveal{opacity:0;transform:translateY(36px);transition:.7s}.reveal.is-visible{opacity:1;transform:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}\u003c/style>\u003csection class=\"hero\">\u003cdiv>\u003cp class=\"reveal\">向下滚动，观察元素进入视口时依次淡入上移。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"section\">\u003cdiv class=\"grid\">\u003carticle class=\"card reveal\">\u003ch3>进入视口\u003c/h3>\u003cp>元素出现前保持静止。\u003c/p>\u003c/article>\u003carticle class=\"card reveal\">\u003ch3>修改 class\u003c/h3>\u003cp>JS 只切换 is-visible。\u003c/p>\u003c/article>\u003carticle class=\"card reveal\">\u003ch3>一次播放\u003c/h3>\u003cp>触发后解除观察。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003cscript>const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{rootMargin:'0px 0px -12%'});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))\u003c/script>\n",
  "\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Demo 2\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f7f7f2;font:16px/1.3 Arial,\"Microsoft YaHei\",sans-serif}.stage{height:300vh}.canvas{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(130deg,#152344,#351b43)}.copy{position:absolute;left:7vw;top:14vh;max-width:460px}.copy h1{font-size:clamp(44px,7vw,84px);line-height:1.3}.product{width:min(55vw,480px);aspect-ratio:1/1.2;border-radius:34px;display:grid;place-items:center;background:linear-gradient(145deg,#eff9ff,#7599bd);box-shadow:0 35px 90px #0008;transform:translate3d(calc(var(--p)*18vw),calc(var(--p)*-6vh),0) rotate(calc(var(--p)*18deg)) scale(calc(.72 + var(--p)*.28))}.product span{font-size:clamp(34px,7vw,80px);font-weight:900;color:#152344}.meter{position:absolute;right:7vw;bottom:9vh;width:180px}.line{height:2px;background:#ffffff44}.fill{height:2px;background:#9edaff;width:calc(var(--p)*100%)}\u003c/style>\u003cdiv class=\"stage\" id=\"stage\">\u003cdiv class=\"canvas\" id=\"canvas\" style=\"--p:0\">\u003cdiv class=\"copy\">\u003cp>滚动距离被归一化为 0～1 的 progress。\u003c/p>\u003c/div>\u003cdiv class=\"product\">\u003cspan>FLOW\u003c/span>\u003c/div>\u003cdiv class=\"meter\">\u003cdiv class=\"line\">\u003cdiv class=\"fill\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cscript>const s=document.querySelector('#stage'),c=document.querySelector('#canvas');addEventListener('scroll',()=>{const r=s.getBoundingClientRect();c.style.setProperty('--p',Math.min(Math.max(-r.top/(r.height-innerHeight),0),1))},{passive:true})\u003c/script>\n",
  "\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Demo 3\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f1eee7;color:#20251f;font:16px/1.3 Arial,\"Microsoft YaHei\",sans-serif}.intro{padding:14vh 8vw 10vh}.intro h1{font-size:clamp(48px,8vw,92px);line-height:1.3}.layout{display:grid;grid-template-columns:1fr 1fr;gap:8vw;padding:0 8vw 18vh}.media{position:sticky;top:10vh;height:70vh;display:grid;place-items:center;border-radius:26px;background:#315c48}.orb{width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#e9f5d6,#98c47a 40%,#35553a 76%)}.item{min-height:70vh;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #20251f2e}.item h2{font-size:clamp(36px,5vw,64px);line-height:1.3}@media(max-width:700px){.layout{grid-template-columns:1fr}.media{position:relative;top:auto;height:48vh}}\u003c/style>\u003cheader class=\"intro\">\u003cp>左侧媒体固定在视口，右侧内容继续滚动。\u003c/p>\u003c/header>\u003csection class=\"layout\">\u003cdiv class=\"media\">\u003cdiv class=\"orb\">\u003c/div>\u003c/div>\u003cdiv>\u003carticle class=\"item\">\u003csmall>FEATURE 01\u003c/small>\u003ch2>留住注意力\u003c/h2>\u003cp>视觉锚点保持稳定。\u003c/p>\u003c/article>\u003carticle class=\"item\">\u003csmall>FEATURE 02\u003c/small>\u003ch2>减少认知跳跃\u003c/h2>\u003cp>信息关系更清楚。\u003c/p>\u003c/article>\u003carticle class=\"item\">\u003csmall>FEATURE 03\u003c/small>\u003ch2>优雅地结束\u003c/h2>\u003cp>自然离开。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003cscript>const o=document.querySelector('.orb');addEventListener('scroll',()=>o.style.transform=`rotate(${scrollY/20}deg)`,{passive:true})\u003c/script>\n",
  "\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Demo 4\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#f7d85d;color:#171714;font:16px/1.3 Arial,\"Microsoft YaHei\",sans-serif}.top{min-height:100vh;display:grid;place-items:center;padding:8vw;position:relative}.top:before{content:\"滚动时，文字逐行出现\";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.18em;font-weight:700;color:#b65c3d;white-space:nowrap}.lead{font-size:clamp(30px,5vw,64px);line-height:1.3;max-width:900px}.line{display:block;overflow:hidden}.line span{display:block;transform:translateY(110%);transition:.85s}.line.active span{transform:none}.dark{min-height:100vh;background:#171714;color:#f7f3e6;padding:14vh 8vw}.dark h2{font-size:clamp(48px,9vw,120px);line-height:1.1}\u003c/style>\u003csection class=\"top\">\u003c/section>\u003csection class=\"dark\">\u003ch2>\u003cspan class=\"line\">\u003cspan>POWERFUL\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan>CLEAN\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan>PERFORMANCE\u003c/span>\u003c/span>\u003c/h2>\u003c/section>\u003cscript>const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('active')),{threshold:.35});document.querySelectorAll('.line').forEach(x=>io.observe(x))\u003c/script>\n",
  "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Demo 5 · Parallax\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#0d2534;color:#f3f6ec;font:16px/1.3 Arial,\"Microsoft YaHei\",sans-serif}.scene{height:220vh;position:relative} .view{height:100vh;position:sticky;top:0;overflow:hidden;isolation:isolate;background:linear-gradient(#153f52 0%,#315463 58%,#213d47 100%)}\n.sun{position:absolute;width:24vw;min-width:170px;aspect-ratio:1;border-radius:50%;background:#ffd983;right:14vw;top:13vh;transform:translateY(calc(var(--scroll)*-.12px));z-index:0}\n.mountain,.ridge,.front{position:absolute;left:-8%;width:116%;bottom:0;transform:translateY(var(--layer-y,0px));will-change:transform}.view:after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(to bottom,transparent,#0b2934 88%);pointer-events:none;z-index:4}.mountain{height:56%;background:#315764;clip-path:polygon(0 100%,0 54%,14% 18%,29% 55%,44% 12%,59% 51%,74% 22%,89% 54%,100% 30%,100% 100%);z-index:1}.ridge{height:44%;background:#1f4852;clip-path:polygon(0 100%,0 48%,13% 17%,28% 60%,46% 20%,63% 57%,79% 26%,92% 59%,100% 32%,100% 100%);z-index:2}.front{height:32%;background:#0b2934;clip-path:polygon(0 100%,0 35%,16% 66%,31% 25%,47% 62%,63% 19%,79% 59%,92% 30%,100% 51%,100% 100%);z-index:3}\n.copy{position:absolute;top:14vh;left:8vw;z-index:4}.copy small{letter-spacing:.2em;color:#ffd983}.copy h1{font-size:clamp(48px,8vw,96px);line-height:1.3;margin:22px 0}.copy p{max-width:620px;font-size:18px;color:#d5ddd3}.hint{position:absolute;bottom:7vh;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.15em;z-index:5}@media(max-width:700px){.copy{left:7vw}.copy h1{font-size:22vw}.mountain{height:52%}.ridge{height:41%}.front{height:31%}}\n\u003c/style>\u003c/head>\u003cbody>\u003csection class=\"scene\" id=\"scene\">\u003cdiv class=\"view\" id=\"view\">\u003cdiv class=\"sun\">\u003c/div>\u003cdiv class=\"mountain\" data-offset=\"0\">\u003c/div>\u003cdiv class=\"ridge\" data-offset=\"26\">\u003c/div>\u003cdiv class=\"front\" data-offset=\"52\">\u003c/div>\u003cdiv class=\"copy\">\u003cp>前景移动更快，背景移动更慢。三条山脊先汇合到同一水平线，再一起向上移动。\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003cscript>\nconst scene=document.querySelector('#scene'),view=document.querySelector('#view'),layers=[...document.querySelectorAll('[data-offset]')];let raf=0;function paint(){const r=scene.getBoundingClientRect(),scroll=Math.min(Math.max(-r.top,0),scene.offsetHeight-innerHeight),p=scroll/(scene.offsetHeight-innerHeight),g=Math.min(p/.58,1),lift=-Math.max((p-.58)/.42,0)*280,targetTop=Math.max(...layers.map(layer=>view.clientHeight-layer.offsetHeight));layers.forEach(layer=>{const baseTop=view.clientHeight-layer.offsetHeight,align=targetTop-baseTop;layer.style.setProperty('--layer-y',((1-g)*Number(layer.dataset.offset)+g*align+lift)+'px')});view.style.setProperty('--scroll',scroll);raf=0}addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(paint)},{passive:true});paint();\n\u003c/script>\u003c/body>\u003c/html>\n"
];
  const frames = [...document.querySelectorAll(".frame")];
  const tabs = [...document.querySelectorAll(".tab")];
  const loaded = new Set();

  function showDemo(index) {
    tabs.forEach((tab, i) => {
      tab.classList.toggle("active", i === index);
      tab.setAttribute("aria-pressed", String(i === index));
    });
    frames.forEach((frame, i) => frame.classList.toggle("active", i === index));
    if (!loaded.has(index)) {
      frames[index].srcdoc = pages[index];
      loaded.add(index);
    }
  }
  tabs.forEach((tab, index) => tab.addEventListener("click", () => showDemo(index)));
  showDemo(0);
</script>
</body>
</html>
